# ======================================================
# LED status macros
# ======================================================

[gcode_macro _LED_ALL]
gcode:
  {% set r = params.R|default(0)|float %}
  {% set g = params.G|default(0)|float %}
  {% set b = params.B|default(0)|float %}
  {% set w = params.W|default(0)|float %}
  SET_LED LED=caselight RED={r} GREEN={g} BLUE={b} WHITE={w}
  SET_LED LED=toolhead_leds RED={r} GREEN={g} BLUE={b} WHITE={w}

[gcode_macro STATUS_HEATING]
gcode: _LED_ALL R=1.0 G=0.35 B=0.0 W=0.0

[gcode_macro STATUS_HOMING]
gcode: _LED_ALL R=0.0 G=0.6 B=1.0 W=0.0

[gcode_macro STATUS_LEVELING]
gcode: _LED_ALL R=0.6 G=0.0 B=0.8 W=0.0

[gcode_macro STATUS_MESHING]
gcode: _LED_ALL R=0.0 G=0.2 B=1.0 W=0.0

[gcode_macro STATUS_PRINTING]
gcode: _LED_ALL R=0.0 G=0.0 B=0.0 W=0.8

[gcode_macro STATUS_IDLE]
gcode: _LED_ALL R=0.0 G=0.0 B=0.0 W=0.3
