# ======================================================
# Adaptive Bed Mesh Calibration
# ======================================================
# Only mesh the area where the print will occur
# This saves significant time on small prints
# Requires EXCLUDE_OBJECT enabled in [printer]

[gcode_macro BED_MESH_ADAPTIVE]
description: Adaptively mesh only the print area
gcode:
  {% set FL_X = params.FL_X|default(20)|float %}
  {% set FL_Y = params.FL_Y|default(20)|float %}
  {% set UR_X = params.UR_X|default(printer.toolhead.axis_maximum.x - 20)|float %}
  {% set UR_Y = params.UR_Y|default(printer.toolhead.axis_maximum.y - 20)|float %}
  
  # Sanity check bounds
  {% if FL_X < 0 %}
    {% set FL_X = 0 %}
  {% endif %}
  {% if FL_Y < 0 %}
    {% set FL_Y = 0 %}
  {% endif %}
  {% if UR_X > printer.toolhead.axis_maximum.x %}
    {% set UR_X = printer.toolhead.axis_maximum.x %}
  {% endif %}
  {% if UR_Y > printer.toolhead.axis_maximum.y %}
    {% set UR_Y = printer.toolhead.axis_maximum.y %}
  {% endif %}
  
  # If bounds are too small or inverted, do full mesh
  {% if (UR_X - FL_X) < 50 or (UR_Y - FL_Y) < 50 %}
    BED_MESH_CALIBRATE
  {% else %}
    # Generate adaptive probe points based on bed size and print area
    {% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}
    {% set x_probes = probe_count.split(',')|list|length if ',' in probe_count|string else probe_count %}
    {% set y_probes = probe_count.split(',')|list[-1]|int if ',' in probe_count|string else probe_count %}
    {% if ',' in probe_count|string %}
      {% set x_probes = probe_count.split(',')|list[0]|int %}
    {% else %}
      {% set x_probes = probe_count|int %}
    {% endif %}
    {% set y_probes = probe_count.split(',')|list[-1]|int if ',' in probe_count|string else probe_count|int %}
    
    # Calculate adaptive probe spacing
    {% set x_step = ((UR_X - FL_X) / (x_probes - 1))|int %}
    {% set y_step = ((UR_Y - FL_Y) / (y_probes - 1))|int %}
    
    # Generate probe points dynamically
    {% set mesh_points = [] %}
    {% for i in range(x_probes) %}
      {% for j in range(y_probes) %}
        {% set x = FL_X + (i * x_step) %}
        {% set y = FL_Y + (j * y_step) %}
        {% set _ = mesh_points.append((x, y)) %}
      {% endfor %}
    {% endfor %}
    
    BED_MESH_CALIBRATE PROFILE=adaptive
  {% endif %}


[gcode_macro MESH_CURRENT_PRINT]
description: Mesh area based on current print boundary (requires slicer integration)
gcode:
  # This is a convenience wrapper that can be called from PRINT_START
  # with parsed bounds from your slicer
  # Usage from slicer (Cura/PrusaSlicer):
  # M1000 X0=20 X1=200 Y0=30 Y1=220
  # Then: MESH_CURRENT_PRINT
  
  # Fallback to safe defaults if not provided by slicer
  {% set FL_X = params.FL_X|default(printer.exclude_object.objects[0].x_min|default(20))|float %}
  {% set FL_Y = params.FL_Y|default(printer.exclude_object.objects[0].y_min|default(20))|float %}
  {% set UR_X = params.UR_X|default(printer.exclude_object.objects[0].x_max|default(330))|float %}
  {% set UR_Y = params.UR_Y|default(printer.exclude_object.objects[0].y_max|default(330))|float %}
  
  BED_MESH_ADAPTIVE FL_X={FL_X} FL_Y={FL_Y} UR_X={UR_X} UR_Y={UR_Y}


[gcode_macro MESH_SAFE_ZONE]
description: Mesh with border margin around print (safest approach)
gcode:
  # Useful wrapper for conservative meshing with safety margin
  # Usage: MESH_SAFE_ZONE MARGIN=10
  
  {% set margin = params.MARGIN|default(10)|float %}
  {% set FL_X = [20, params.FL_X|default(0)|float - margin] | max %}
  {% set FL_Y = [20, params.FL_Y|default(0)|float - margin] | max %}
  {% set UR_X = [printer.toolhead.axis_maximum.x - 20, params.UR_X|default(350)|float + margin] | min %}
  {% set UR_Y = [printer.toolhead.axis_maximum.y - 20, params.UR_Y|default(350)|float + margin] | min %}
  
  BED_MESH_ADAPTIVE FL_X={FL_X} FL_Y={FL_Y} UR_X={UR_X} UR_Y={UR_Y}
