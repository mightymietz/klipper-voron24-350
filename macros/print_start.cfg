# ======================================================
# PRINT_START
# ======================================================

[gcode_macro PRINT_START]
gcode:
  {% set BED = params.BED|int %}
  {% set EXTRUDER = params.EXTRUDER|int %}
  {% set CHAMBER = params.CHAMBER|default(45)|int %}
  {% set XMID = printer.toolhead.axis_maximum.x / 2 %}
  {% set YMID = printer.toolhead.axis_maximum.y / 2 %}

  SET_GCODE_OFFSET Z=0
  STATUS_HOMING
  G28
  G90
  BED_MESH_CLEAR

  M104 S160

  STATUS_HEATING
  G1 X{XMID} Y{YMID} Z15 F9000
  M190 S{BED}

  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED-1}
  TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={BED+1}

  {% if BED > 90 %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={CHAMBER}
  {% endif %}

  M109 S160
  CLEAN_NOZZLE

  STATUS_LEVELING
  QUAD_GANTRY_LEVEL
  CARTOGRAPHER_TOUCH_HOME

  STATUS_MESHING
  BED_MESH_CALIBRATE

  STATUS_HEATING
  M109 S{EXTRUDER}
  CLEAN_NOZZLE

  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1

  STATUS_PRINTING
  G0 X{XMID-120} Y5 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  G90
